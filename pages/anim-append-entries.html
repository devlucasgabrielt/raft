<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Raft AppendEntries</title>
    <link rel="stylesheet" href="../styles/raft-theme.css">
    <style>
        /* ==================================================================
           ESTILOS ESPECÍFICOS DE LA PÁGINA (CONTROLES Y PANELES)
           ================================================================== */
        .timeline-controls { 
            display: flex; gap: 20px; margin-top: 40px; padding-bottom: 50px; width: 100%; 
        }
        
        .timeline-panel {
            flex: 1; background: #FFFFFF; border: 2px solid #CED4DA; border-radius: 10px;
            padding: 20px 25px; display: flex; flex-direction: column; transition: all 0.2s;
        }

        .timeline-header { 
            font-size: 18px; font-weight: bold; color: var(--follower-border); 
            margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; 
        }

        .var-val { 
            color: var(--text-main); background: #E9ECEF; padding: 4px 10px; 
            border-radius: 4px; border: 1px solid #CED4DA; font-weight: 900; 
        }

        input[type="range"] { 
            width: 100%; cursor: pointer; height: 8px; background: #DEE2E6; 
            border-radius: 4px; outline: none; margin-bottom: 15px; 
        }

        .step-desc { 
            height: 45px; font-size: 15.5px; font-weight: 600; color: #495057; 
            margin-bottom: 10px; line-height: 1.4; display: flex; align-items: flex-start; 
        }
        
        .play-controls { 
            display: flex; gap: 10px; border-top: 1px solid #DEE2E6; 
            padding-top: 15px; justify-content: flex-start; 
        }

        button { 
            padding: 8px 16px; font-size: 15px; font-weight: bold; cursor: pointer; 
            background: #FFF; color: var(--text-main); border: 2px solid var(--border-heavy); 
            border-radius: 6px; transition: all 0.2s; 
        }

        button:hover:not(:disabled) { background: #E9ECEF; }
        
        button.primary { background: var(--follower-border); color: #FFF; border-color: var(--follower-border); }
        button.primary:hover:not(:disabled) { background: #174EA6; }
        
        button.danger { background: #DC3545; color: #FFF; border-color: #DC3545; }
        
        button.highlight-btn { background: #F9AB00; color: #000; border-color: #F9AB00; }
        button.highlight-btn:hover { background: #E69B00; }
        
        button:disabled { background: #E9ECEF !important; color: #ADB5BD !important; cursor: not-allowed; border-color: #DEE2E6 !important; }
    </style>
</head>
<body>
    <div class="raft-wrapper" id="raft-wrapper">
        <div class="velocity-bar">
            <span>Velocidad Auto Play:</span>
            <input type="range" id="slider-speed" min="0.1" max="2" step="0.1" value="0.8" style="width: 200px; margin: 0;">
            <span id="speed-val">0.80x</span>
            <button onclick="toggleMaximize()" class="highlight-btn" style="margin-left: auto;" id="btn-maximize">🔲 Pantalla Completa</button>
            <button onclick="resetBoth()">🔄 Reset All States</button>
        </div>

        <div class="dashboard" id="dashboard">
            <table class="board">
                <thead>
                    <tr>
                        <th style="width: 90px;"></th>
                        <th style="width: 85px;" class="idx-header">10</th><th style="width: 85px;" class="idx-header">11</th>
                        <th style="width: 85px;" class="idx-header">12</th><th style="width: 85px;" class="idx-header">13</th>
                        <th class="rpc-header" id="hdr-rpc-S2">RPC S3 &lt;-&gt; S2</th>
                        <th class="rpc-header" id="hdr-rpc-S1">RPC S3 &lt;-&gt; S1</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td class="td-label first-row-padding"><div class="node-label follower-label" id="label-S1">S1</div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-10"></div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-11"></div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-12"></div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-13"></div></td><td class="rpc-zone first-row-padding" rowspan="2"></td><td class="rpc-zone first-row-padding" rowspan="2"></td></tr>
                    <tr><td colspan="5" class="td-eval"><div class="row-eval" id="eval-S1"></div></td></tr>
                    <tr><td class="td-label"><div class="node-label follower-label" id="label-S2">S2</div></td><td class="td-cell"><div class="cell" id="c-S2-10"></div></td><td class="td-cell"><div class="cell" id="c-S2-11"></div></td><td class="td-cell"><div class="cell" id="c-S2-12"></div></td><td class="td-cell"><div class="cell" id="c-S2-13"></div></td><td class="rpc-zone" rowspan="2"></td><td class="rpc-zone" rowspan="2"></td></tr>
                    <tr><td colspan="5" class="td-eval"><div class="row-eval" id="eval-S2"></div></td></tr>
                    <tr><td class="td-label"><div class="node-label leader-label" id="label-S3">S3*</div></td><td class="td-cell"><div class="cell has-data" id="c-S3-10">3</div></td><td class="td-cell"><div class="cell has-data" id="c-S3-11">3</div></td><td class="td-cell"><div class="cell has-data" id="c-S3-12">5</div></td><td class="td-cell"><div class="cell empty-cell" id="c-S3-13">-</div></td><td class="rpc-zone" rowspan="2"></td><td class="rpc-zone" rowspan="2"></td></tr>
                    <tr><td colspan="5" class="td-eval" style="border: none;"><div class="row-eval" id="eval-S3"></div></td></tr>
                </tbody>
            </table>
            <div id="packet-S1" class="flying-packet"></div>
            <div id="packet-S2" class="flying-packet"></div>
        </div>
        
        <div class="timeline-controls">
            <div class="timeline-panel" id="panel-S1">
                <div class="timeline-header"><span>Sincronización de S1</span><span>nextIndex[S1] = <span class="var-val" id="ni-S1">13</span></span></div>
                <div class="step-desc" id="desc-S1"></div>
                <input type="range" id="scrubber-S1" min="0" max="15" value="0">
                <div class="play-controls">
                    <button id="btn-play-S1" class="primary" onclick="togglePlay('S1')">▶ Auto-Play Sync</button>
                    <button id="btn-prev-S1" onclick="step('S1', -1)">◀ Prev</button>
                    <button id="btn-next-S1" onclick="step('S1', 1)">Next ▶</button>
                </div>
            </div>
            <div class="timeline-panel" id="panel-S2">
                <div class="timeline-header"><span>Sincronización de S2</span><span>nextIndex[S2] = <span class="var-val" id="ni-S2">13</span></span></div>
                <div class="step-desc" id="desc-S2"></div>
                <input type="range" id="scrubber-S2" min="0" max="12" value="0">
                <div class="play-controls">
                    <button id="btn-play-S2" class="primary" onclick="togglePlay('S2')">▶ Auto-Play Sync</button>
                    <button id="btn-prev-S2" onclick="step('S2', -1)">◀ Prev</button>
                    <button id="btn-next-S2" onclick="step('S2', 1)">Next ▶</button>
                </div>
            </div>
        </div>
        <div class="slogan-footer">TA050 - Sistemas Distribuidos I - Cátedra Espina</div>
    </div>
    
    <script>
        const rpcTitle = (title, color) => `<div style="border-bottom: 2px solid ${color}; margin-bottom: 8px; padding-bottom: 6px; font-size: 15px; font-weight: 900; text-align: center; color: ${color}; letter-spacing: 1px;">${title}</div>`;

        const reqTxt = (idx, term, entries) => `${rpcTitle('AppendEntries', '#856404')}<span style="color:#856404">prevLogIndex = ${idx}</span><br><span style="color:#856404">prevLogTerm = ${term}</span><br><span style="color:#856404">entries = [${entries}]</span>`;
        const accTxt = () => `${rpcTitle('Response', '#155724')}<span style="color:#155724">term = 6<br>success = true</span>`;
        const rejTxt = () => `${rpcTitle('Response', '#721C24')}<span style="color:#721C24">term = 6<br>success = false</span>`;
        
        const wait = `<span style="color:#6c757d">Evaluando AppendEntries...</span>`;
        const tooShort = `<span style="color:#B31412">❌ Rechazado: Log es demasiado corto</span>`;
        const mismatch = `<span style="color:#B31412">❌ Rechazado: Term no coincide!</span>`;
        const match = `<span style="color:#0F5132">✅ Aceptado: match index y term!</span>`;
        const deletingTxt = `<span style="color:#B31412">❌ Conflicto: Se BORRAN las entrada(s)</span>`;
        const synced = `<span style="color:#0F5132">✅ Los logs ahora están sincronizados</span>`;

        const S1_TL = [
            { d: "Estado Inicial. S3 asume el liderazgo en el Term 6. Inicializa nextIndex=13 para los seguidores.", l3: [3, 3, 5], l: [3], ni: 13, h: null, pkt: null },
            { d: "Un cliente envía un nuevo comando. S3 lo anexa a su log en el index 13.", l3: [3, 3, 5, 6], l: [3], ni: 13, h3: 13, pkt: null },
            { d: "S3 inicia replicación. Al creer que S1 está al día (nextIndex=13), envía la entrada validando prevLogIndex=12.", l3: [3, 3, 5, 6], l: [3], ni: 13, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(12, 5, '6') }, tp: 12, te: [13] },
            { d: "Se envia RPC a S1. S1 busca si tiene algún elemento en index 12.", l3: [3, 3, 5, 6], l: [3], ni: 13, h: 12, e: wait, pkt: { loc: 'S1', type: 'request', txt: reqTxt(12, 5, '6') } },
            { d: "El log de S1 no tiene index 12 (demasiado corto). El chequeo de consistencia falla.", l3: [3, 3, 5, 6], l: [3], ni: 13, h: 12, e: tooShort, pkt: { loc: 'S1', type: 'reject', txt: rejTxt() } },
            { d: "S1 rechaza el paquete y devuelve success=false al líder.", l3: [3, 3, 5, 6], l: [3], ni: 13, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "S3 detecta inconsistencia, decrementa nextIndex a 12 e intenta enviar los entries [5, 6].", l3: [3, 3, 5, 6], l: [3], ni: 12, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(11, 3, '5, 6') }, tp: 11, te: [12, 13] },
            { d: "Se envia RPC a S1. S1 busca si tiene el prevLogIndex 11.", l3: [3, 3, 5, 6], l: [3], ni: 12, h: 11, e: wait, pkt: { loc: 'S1', type: 'request', txt: reqTxt(11, 3, '5, 6') } },
            { d: "El log de S1 no tiene index 11. El chequeo de consistencia vuelve a fallar.", l3: [3, 3, 5, 6], l: [3], ni: 12, h: 11, e: tooShort, pkt: { loc: 'S1', type: 'reject', txt: rejTxt() } },
            { d: "S1 rechaza el paquete y devuelve success=false al líder.", l3: [3, 3, 5, 6], l: [3], ni: 12, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "S3 decrementa nextIndex a 11 e intenta enviar los entries [3, 5, 6].", l3: [3, 3, 5, 6], l: [3], ni: 11, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(10, 3, '3, 5, 6') }, tp: 10, te: [11, 12, 13] },
            { d: "Se envia RPC a S1. S1 busca si tiene el prevLogIndex 10.", l3: [3, 3, 5, 6], l: [3], ni: 11, h: 10, e: wait, pkt: { loc: 'S1', type: 'request', txt: reqTxt(10, 3, '3, 5, 6') } },
            { d: "¡S1 TIENE el index 10 con el Term 3! El chequeo es exitoso.", l3: [3, 3, 5, 6], l: [3], ni: 11, h: 10, e: match, pkt: { loc: 'S1', type: 'request', txt: reqTxt(10, 3, '3, 5, 6') } },
            { d: "S1 acepta el paquete y anexa el bloque de datos [3, 5, 6].", l3: [3, 3, 5, 6], l: [3, 3, 5, 6], ni: 11, h: null, e: "S1 actualiza su log.", pkt: { loc: 'S1', type: 'accept', txt: accTxt() } },
            { d: "S1 devuelve success=true al líder.", l3: [3, 3, 5, 6], l: [3, 3, 5, 6], ni: 11, h: null, pkt: { loc: 'S3', type: 'accept', txt: accTxt() } },
            { d: "El líder recibe confirmación y actualiza nextIndex a 14. S1 está sincronizado.", l3: [3, 3, 5, 6], l: [3, 3, 5, 6], ni: 14, h: null, e: synced, pkt: null }
        ];

        const S2_TL = [
            { d: "Estado Inicial. S3 asume el liderazgo (nextIndex=13). S2 tiene un conflicto de término oculto.", l3: [3, 3, 5], l: [3, 3, 4], ni: 13, h: null, del: null, e: "", pkt: null },
            { d: "El cliente envía un comando. S3 lo anexa al index 13.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 13, h3: 13, pkt: null },
            { d: "S3 inicia la replicación asumiendo nextIndex=13. Envía entrada 13 validando contra prevLogIndex=12.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 13, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(12, 5, '6') }, tp: 12, te: [13] },
            { d: "RPC viaja a S2. S2 evalúa si su index 12 coincide con el Term 5 del líder.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 13, h: 12, e: wait, pkt: { loc: 'S2', type: 'request', txt: reqTxt(12, 5, '6') } },
            { d: "S2 tiene Term 4 en el index 12. ¡Inconsistencia detectada! Falla.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 13, h: 12, e: mismatch, pkt: { loc: 'S2', type: 'reject', txt: rejTxt() } },
            { d: "S2 rechaza el paquete y devuelve success=false al líder.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 13, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "S3 decrementa nextIndex a 12 e intenta enviar los entries [5, 6].", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 12, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(11, 3, '5, 6') }, tp: 11, te: [12, 13] },
            { d: "RPC viaja a S2. S2 evalúa si su index 11 coincide con el Term 3 del líder.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 12, h: 11, e: wait, pkt: { loc: 'S2', type: 'request', txt: reqTxt(11, 3, '5, 6') } },
            { d: "¡S2 TIENE el index 11 con el Term 3! El chequeo es exitoso.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 12, h: 11, e: match, pkt: { loc: 'S2', type: 'request', txt: reqTxt(11, 3, '5, 6') } },
            { d: "S2 detecta el conflicto en index 12. Borra esa entrada obsoleta.", l3: [3, 3, 5, 6], l: [3, 3, 4], ni: 12, h: null, del: 12, e: deletingTxt, pkt: { loc: 'S2', type: 'request', txt: reqTxt(11, 3, '5, 6') } },
            { d: "S2 acepta el paquete y anexa las nuevas entradas [5, 6].", l3: [3, 3, 5, 6], l: [3, 3, 5, 6], ni: 12, h: null, e: "S2 escribe entradas del líder.", pkt: { loc: 'S2', type: 'accept', txt: accTxt() } },
            { d: "S2 devuelve success=true al líder.", l3: [3, 3, 5, 6], l: [3, 3, 5, 6], ni: 12, h: null, pkt: { loc: 'S3', type: 'accept', txt: accTxt() } },
            { d: "El líder recibe confirmación y actualiza nextIndex a 14. S2 está sincronizado.", l3: [3, 3, 5, 6], l: [3, 3, 5, 6], ni: 14, h: null, e: synced, pkt: null }
        ];
    </script>
    <script src="../scripts/raft-engine.js"></script>
</body>
</html>
