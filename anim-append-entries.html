<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raft AppendEntries</title>
    <link rel="stylesheet" href="raft-theme.css">
</head>
<body>
    <div class="raft-wrapper" id="raft-wrapper">
        <div class="velocity-bar">
            <span>Global Auto-Play Velocity:</span>
            <input type="range" id="slider-speed" min="0.1" max="2" step="0.1" value="0.8" style="width: 200px; margin: 0;">
            <span id="speed-val">0.80x</span>
            <button onclick="toggleMaximize()" class="highlight-btn" style="margin-left: auto;" id="btn-maximize">🔲 Pantalla Completa</button>
            <button onclick="resetBoth()">🔄 Reset All States</button>
        </div>

        <div class="dashboard" id="dashboard">
            <table class="board">
                <thead>
                    <tr>
                        <th style="width: 90px;"></th>
                        <th style="width: 85px;" class="idx-header">10</th><th style="width: 85px;" class="idx-header">11</th>
                        <th style="width: 85px;" class="idx-header">12</th><th style="width: 85px;" class="idx-header">13</th>
                        <th class="rpc-header" id="hdr-rpc-S2">RPC S3 &lt;-&gt; S2</th>
                        <th class="rpc-header" id="hdr-rpc-S1">RPC S3 &lt;-&gt; S1</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td class="td-label first-row-padding"><div class="node-label follower-label" id="label-S1">S1</div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-10"></div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-11"></div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-12"></div></td><td class="td-cell first-row-padding"><div class="cell" id="c-S1-13"></div></td><td class="rpc-zone first-row-padding" rowspan="2"></td><td class="rpc-zone first-row-padding" rowspan="2"></td></tr>
                    <tr><td colspan="5" class="td-eval"><div class="row-eval" id="eval-S1"></div></td></tr>
                    <tr><td class="td-label"><div class="node-label follower-label" id="label-S2">S2</div></td><td class="td-cell"><div class="cell" id="c-S2-10"></div></td><td class="td-cell"><div class="cell" id="c-S2-11"></div></td><td class="td-cell"><div class="cell" id="c-S2-12"></div></td><td class="td-cell"><div class="cell" id="c-S2-13"></div></td><td class="rpc-zone" rowspan="2"></td><td class="rpc-zone" rowspan="2"></td></tr>
                    <tr><td colspan="5" class="td-eval"><div class="row-eval" id="eval-S2"></div></td></tr>
                    <tr><td class="td-label"><div class="node-label leader-label" id="label-S3">S3*</div></td><td class="td-cell"><div class="cell has-data" id="c-S3-10">3</div></td><td class="td-cell"><div class="cell has-data" id="c-S3-11">3</div></td><td class="td-cell"><div class="cell has-data" id="c-S3-12">5</div></td><td class="td-cell"><div class="cell has-data" id="c-S3-13">6</div></td><td class="rpc-zone" rowspan="2"></td><td class="rpc-zone" rowspan="2"></td></tr>
                    <tr><td colspan="5" class="td-eval" style="border: none;"><div class="row-eval" id="eval-S3"></div></td></tr>
                </tbody>
            </table>
            <div id="packet-S1" class="flying-packet"></div>
            <div id="packet-S2" class="flying-packet"></div>
        </div>

        <div class="timeline-controls">
            <div class="timeline-panel">
                <div class="timeline-header"><span>Sincronización de S1</span><span>nextIndex[S1] = <span class="var-val" id="ni-S1">14</span></span></div>
                <div class="step-desc" id="desc-S1"></div>
                <input type="range" id="scrubber-S1" min="0" max="17" value="0">
                <div class="play-controls"><button id="btn-play-S1" class="primary" onclick="togglePlay('S1')">▶ Auto-Play Sync</button><button id="btn-prev-S1" onclick="step('S1', -1)">◀ Prev</button><button id="btn-next-S1" onclick="step('S1', 1)">Next ▶</button></div>
            </div>
            <div class="timeline-panel">
                <div class="timeline-header"><span>Sincronización de S2</span><span>nextIndex[S2] = <span class="var-val" id="ni-S2">14</span></span></div>
                <div class="step-desc" id="desc-S2"></div>
                <input type="range" id="scrubber-S2" min="0" max="14" value="0">
                <div class="play-controls"><button id="btn-play-S2" class="primary" onclick="togglePlay('S2')">▶ Auto-Play Sync</button><button id="btn-prev-S2" onclick="step('S2', -1)">◀ Prev</button><button id="btn-next-S2" onclick="step('S2', 1)">Next ▶</button></div>
            </div>
        </div>
    </div>
    
    <script>
        const rpcTitle = (title, color) => `<div style="border-bottom: 2px solid ${color}; margin-bottom: 8px; padding-bottom: 6px; font-size: 15px; font-weight: 900; text-transform: uppercase; text-align: center; color: ${color}; letter-spacing: 1px;">${title}</div>`;

        const reqTxt = (idx, term, entries) => `${rpcTitle('AppendEntries', '#856404')}<span style="color:#856404">prevLogIndex = ${idx}</span><br><span style="color:#856404">prevLogTerm = ${term}</span><br><span style="color:#856404">entries = [${entries}]</span>`;
        const accTxt = () => `${rpcTitle('Response', '#155724')}<span style="color:#155724">term = 6<br>success = true</span>`;
        const rejTxt = () => `${rpcTitle('Response', '#721C24')}<span style="color:#721C24">term = 6<br>success = false</span>`;
        
        const wait = `<span style="color:#6c757d">Evaluando AppendEntries...</span>`;
        const tooShort = `<span style="color:#B31412">❌ Rechazado: Log es demasiado corto</span>`;
        const mismatch = `<span style="color:#B31412">❌ Rechazado: Term no coincide!</span>`;
        const match = `<span style="color:#0F5132">✅ Aceptado: match index y term!</span>`;
        const deletingTxt = `<span style="color:#B31412">❌ Conflicto: Se BORRAN las entrada(s)</span>`;
        const synced = `<span style="color:#0F5132">✅ Los logs ahora están sincronizados</span>`;

        const S1_TL = [
            { d: "Estado Inicial. Log de S1 esta atrasado.", l: [3], ni: 14, h: null, pkt: null },
            { d: "Lider crea un AppendEntries, inicia validando el index 13.", l: [3], ni: 14, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(12, 5, '6') }, tp: 12, te: [13] },
            { d: "Se envia RPC a S1. S1 Evalua si tiene el index 13.", l: [3], ni: 14, h: 13, e: wait, pkt: { loc: 'S1', type: 'request', txt: reqTxt(12, 5, '6') } },
            { d: "El log de S1 es inconsistente respecto al lider (faltan elementos). El check de consistencia falla.", l: [3], ni: 14, h: 13, e: tooShort, pkt: { loc: 'S1', type: 'reject', txt: rejTxt() } },
            { d: "Rejection travels back to the Leader.", l: [3], ni: 14, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "Leader decrements nextIndex and retries.", l: [3], ni: 13, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(11, 3, '5,6') }, tp: 11, te: [12, 13] },
            { d: "RPC travels to S1. S1 evaluates if it has index 12.", l: [3], ni: 13, h: 12, e: wait, pkt: { loc: 'S1', type: 'request', txt: reqTxt(11, 3, '5,6') } },
            { d: "S1 log is inconsistent (missing). Consistency check fails.", l: [3], ni: 13, h: 12, e: tooShort, pkt: { loc: 'S1', type: 'reject', txt: rejTxt() } },
            { d: "Rejection travels back to the Leader.", l: [3], ni: 13, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "Leader decrements nextIndex and retries.", l: [3], ni: 12, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(10, 3, '3,5,6') }, tp: 10, te: [11, 12, 13] },
            { d: "RPC travels to S1. S1 evaluates if it has index 11.", l: [3], ni: 12, h: 11, e: wait, pkt: { loc: 'S1', type: 'request', txt: reqTxt(10, 3, '3,5,6') } },
            { d: "S1 log is inconsistent (missing). Consistency check fails.", l: [3], ni: 12, h: 11, e: tooShort, pkt: { loc: 'S1', type: 'reject', txt: rejTxt() } },
            { d: "Rejection travels back to the Leader.", l: [3], ni: 12, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "Leader decrements nextIndex and retries.", l: [3], ni: 11, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(9, 3, '3,5,6') }, tp: 9, te: [10, 11, 12, 13] },
            { d: "RPC travels to S1. S1 HAS index 10 with Term 3! Match!", l: [3], ni: 11, h: 10, e: match, pkt: { loc: 'S1', type: 'request', txt: reqTxt(9, 3, '3,5,6') } },
            { d: "S1 accepts and appends the batch [3,5,6].", l: [3, 3, 5, 6], ni: 11, h: null, e: "S1 updated log.", pkt: { loc: 'S1', type: 'accept', txt: accTxt() } },
            { d: "Acceptance travels back to the Leader.", l: [3, 3, 5, 6], ni: 11, h: null, pkt: { loc: 'S3', type: 'accept', txt: accTxt() } },
            { d: "Leader updates nextIndex. S1 is fully synchronized.", l: [3, 3, 5, 6], ni: 14, h: null, e: synced, pkt: null }
        ];

        const S2_TL = [
            { d: "Estado Inicial. S2 tiene un conflicto de término en el index 12.", l: [3, 3, 4], ni: 14, h: null, del: null, e: "", pkt: null },
            { d: "Lider crea un AppendEntries, inicia checkeando el index 13.", l: [3, 3, 4], ni: 14, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(12, 5, '6') }, tp: 12, te: [13] },
            { d: "RPC travels to S2. S2 evaluates if it has index 13.", l: [3, 3, 4], ni: 14, h: 13, e: wait, pkt: { loc: 'S2', type: 'request', txt: reqTxt(12, 5, '6') } },
            { d: "S2 log is inconsistent (missing). Consistency check fails.", l: [3, 3, 4], ni: 14, h: 13, e: tooShort, pkt: { loc: 'S2', type: 'reject', txt: rejTxt() } },
            { d: "Rejection travels back to the Leader.", l: [3, 3, 4], ni: 14, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "Leader decrements nextIndex and retries.", l: [3, 3, 4], ni: 13, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(11, 3, '5,6') }, tp: 11, te: [12, 13] },
            { d: "RPC travels to S2. S2 evaluates if index 12 matches Term 5.", l: [3, 3, 4], ni: 13, h: 12, e: wait, pkt: { loc: 'S2', type: 'request', txt: reqTxt(11, 3, '5,6') } },
            { d: "S2 has Term 4 at index 12. Consistency check fails.", l: [3, 3, 4], ni: 13, h: 12, e: mismatch, pkt: { loc: 'S2', type: 'reject', txt: rejTxt() } },
            { d: "Rejection travels back to the Leader.", l: [3, 3, 4], ni: 13, h: null, pkt: { loc: 'S3', type: 'reject', txt: rejTxt() } },
            { d: "Leader decrements nextIndex and retries.", l: [3, 3, 4], ni: 12, h: null, pkt: { loc: 'S3', type: 'request', txt: reqTxt(11, 3, '5,6') }, tp: 11, te: [12, 13] },
            { d: "RPC travels to S2. S2 HAS index 11 with Term 3! Match!", l: [3, 3, 4], ni: 12, h: 11, e: match, pkt: { loc: 'S2', type: 'request', txt: reqTxt(11, 3, '5,6') } },
            { d: "S2 detects a term conflict at index 12. Deleting entry...", l: [3, 3, 4], ni: 12, h: null, del: 12, e: deletingTxt, pkt: { loc: 'S2', type: 'request', txt: reqTxt(11, 3, '5,6') } },
            { d: "S2 accepts. It appends the new entries [5,6].", l: [3, 3, 5, 6], ni: 12, h: null, e: "S2 overwrote conflicting entries.", pkt: { loc: 'S2', type: 'accept', txt: accTxt() } },
            { d: "Acceptance travels back to the Leader.", l: [3, 3, 5, 6], ni: 12, h: null, pkt: { loc: 'S3', type: 'accept', txt: accTxt() } },
            { d: "Leader updates nextIndex. S2 is fully synchronized.", l: [3, 3, 5, 6], ni: 14, h: null, e: synced, pkt: null }
        ];
    </script>
    <script src="raft-engine.js"></script>
</body>
</html>
